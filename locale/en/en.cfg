[mod-setting-description]
Alarms-Low-Level=Enables the alarms warning that 50/75/90 % of the water has been depleted.
Alarms-High-Level=Enables the alarms warning that 95/97/98/99 % of the water has been depleted.
Alarms-Tile-Message=Enables the message showing the new waterbody size after landfill or waterfill has been used.
FluidArea-Start-Area=The amount of tiles that a new waterbody will scan instantly (same tick). WARNING: Higher numbers may cause Factorio to Freeze/Loose FPS for a number seconds. (20/50/10,000)
FluidArea-Additional-Tiles-Per-Second=Amount of tiles that are being scanned per second (distributed over multiple waterbodies and ticks).WARNING: Higher numbers may cause Factorio to Freeze/Loose FPS for a number seconds. (100/1,000/100,000)
TileFluidAmount-Shallow=Amount of fluid that a shallow tile holds. (10/50/5,000)
TileFluidAmount-Deep=Amount of fluid that a deep tile holds. (20/150/10,000)
FluidArea-RegenRate= The rate at default value (100) is 0.01 per second per tile, Increase this to regen more, or decrease to regen less. (0/100/1,000)
WaterBody-Centroid-Shift-Threshold=Relative centroid movement (as a fraction of the waterbody diameter) required before cached geometry bins are rebuilt. Higher values reduce recalculation frequency. (0.0/0.025/0.5)
Visual-Depletion-Start-Percentage=The percentage at which the visual depletion will start - water tiles will be replaced with dried/land equivalents. (50/80/95)
Pumps-Reactivation-LevelPerThousand=The level (per thousand) at which the waterbody will no longer be depleted after reaching depletion and the pumps will be reactivated. (1/990/1,000)
FluidArea-RemoveDepletedOrphaned=Waterbodies will be instantly removed if they are depleted and orphaned. Reactivation Level setting will control how long the waterbody will be considered depleted.
Map-EnableMarkers=Real-time Map Markers that indicate the Name, remaining amount of fluid and the remaining percentage.
FluidArea-MaxFluidAreaSize=Maximum size of the waterbody that will be scanned. Above that no more tiles will be added to the waterbody. 600,000 is an Ocean. Value 0 means no limit. (0/0/9,999,999,999)
FluidArea-Scanning-Loop-Period=Seconds between in-progress scan reminders while a waterbody is still being explored. Lower values will print status messages more frequently. (5/20/600)
Update-Budget-Per-Second=Relative amount of updates per second that the mod will perform including tile events, scanning, and extra work such as preparing and optimizing the data structures behind the scenes, and others. WARNING: Higher numbers may cause Factorio to Freeze/Loose FPS for a number seconds. (200/2,000/200,000)
Split-Max-BBox-Side=Maximum side length of the bounding box used during split-time connected-tile checks to avoid long stalls on huge waterbodies. WARNING: Higher numbers may cause Factorio to Freeze/Loose FPS for a number seconds (only on tricky splits). (16/32/1,024)
Split-Max-Adjacent-Landfill-Depth-Check=Maximum depth of the adjacent landfills to check for a split check. If using landfill brush wider than this value - a potential split will be triggered and waterbody will be rescanned. WARNING: Higher numbers may cause Factorio to Freeze/Loose FPS for a number seconds (only on heavy big-brush landfills). (8/16/64)
Split-Finalize-Max-Landfills-Per-Update=Maximum number of landfills to process per update while finalizing a split identity assignment. WARNING: Higher numbers may cause Factorio to Freeze/Loose FPS for a number seconds. (10/100/10,000)
WaterBody-Regen-Scaling=Multiplier applied per size tier when calculating natural regeneration. Lakes have a reference value of 100%. Values above 1.0 boost large bodies, values below 1.0 tone them down. (0.5/1.5/3.0)

