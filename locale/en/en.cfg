[mod-setting-description]
Alarm-Depletion-Level=Controls which depletion alarms are shown. "none" disables all, "major" shows 50%/90%/99% only, "all" shows full set (50/75/90/95/97/98/99%).
Alarms-Tile-Message=Enables the message showing the new waterbody size after landfill or waterfill has been used.
Scan-Instant-Tiles=The amount of tiles that a new waterbody will scan instantly (same tick). WARNING: Higher numbers may cause Factorio to Freeze/Lose FPS for a few seconds. (20/50/10,000)
Scan-Tiles-Per-Second=Amount of tiles scanned per second (distributed over multiple waterbodies and ticks). WARNING: Higher numbers may cause Factorio to Freeze/Lose FPS for a few seconds. (100/1,000/100,000)
Scan-Status-Period=Seconds between in-progress scan reminders while a waterbody is still being explored. Lower values print status messages more frequently. (5/20/600)
TileFluidAmount-Shallow=Amount of fluid that a shallow tile holds. (10/50/5,000)
TileFluidAmount-Deep=Amount of fluid that a deep tile holds. (20/150/10,000)
Waterbody-Max-Size=Maximum waterbody size that will be scanned. Above this limit no more tiles will be added. 600,000 is an Ocean. Value 0 means no limit. (0/0/9,999,999,999)
Waterbody-Regen-Rate=The rate at default value (100) is 0.01 per second per tile. Increase to regen more, decrease to regen less. (0/100/1,000)
WaterBody-Regen-Scaling=Multiplier applied per size tier when calculating natural regeneration. Lakes have a reference value of 100%. Values above 1.0 boost large bodies, values below 1.0 tone them down. (0.5/1.5/3.0)
Update-Budget-Per-Second=Relative amount of updates per second including tile events, scanning, and background optimization work. WARNING: Higher numbers may cause Factorio to Freeze/Lose FPS for a few seconds. (200/2,000/200,000)
WaterBody-Centroid-Shift-Threshold=Relative centroid movement (as a fraction of waterbody diameter) required before cached geometry bins are rebuilt. Higher values reduce recalculation frequency. (0.0/0.025/0.5)
Visual-Depletion-Start-Percentage=The percentage at which visual depletion starts - water tiles will be replaced with dried/land equivalents. (50/80/95)
Visual-Depletion-Furthest-First=When enabled, waterbody depletion visuals dry tiles starting from the perimeter and close in toward the centroid. Disable to dry from the centroid outward.
Pumps-Reactivation-LevelPerThousand=The level (per thousand, e.g. 990 = 99%) at which the waterbody will no longer be depleted and pumps will be reactivated. (1/990/1,000)
Cleanup-Remove-Depleted-Orphaned=Waterbodies will be instantly removed if they are depleted and orphaned. Reactivation Level setting controls how long the waterbody will be considered depleted.
Split-Max-BBox-Side=Maximum bounding box side length for split-time connected-tile checks. WARNING: Higher numbers may cause FPS drops on tricky splits. (16/32/1,024)
Split-Max-Adjacent-Landfill-Depth-Check=Maximum depth of adjacent landfills to check for splits. Landfill brushes wider than this value will trigger a rescan. WARNING: Higher numbers may cause FPS drops on big-brush landfills. (8/16/128)
Split-Finalize-Max-Landfills-Per-Update=Maximum landfills to process per update while finalizing split identity assignment. WARNING: Higher numbers may cause FPS drops. (10/100/10,000)
Map-EnableMarkers=Real-time Map Markers that indicate the Name, remaining amount of fluid and the remaining percentage.
Enable-Waterfill=Enable this mod's built-in waterfill feature. If CanalBuilderMAV is active, built-in waterfill is disabled automatically regardless of this setting.

