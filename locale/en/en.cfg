[mod-setting-description]
Alarms-Low-Level=Enables the alarms warning that 50/75/90 % of the water has been depleted.
Alarms-High-Level=Enables the alarms warning that 95/97/98/99 % of the water has been depleted.
Alarms-Tile-Message=Enables the message showing the new FluidArea size after landfill or waterfill has been used.
FluidArea-Start-Area=The amount of tiles that a pump/drain will look for when being the first to be placed in a new body of water.WARNING: Higher numbers may cause Factorio to Freeze/Loose FPS for a number seconds. (10/50/1,000)
FluidArea-Additional-Tiles-Per-Second=If an water area is above the FluidArea - Initial Size (Tiles), this will be the additional number of tiles per second added to the FluidArea.WARNING: Higher numbers may cause Factorio to Freeze/Loose FPS for a number seconds. (50/200/10,000)
TileFluidAmount-Shallow=Amount of fluid that a shallow tile holds. (10/50/5000)
TileFluidAmount-Deep=Amount of fluid that a deep tile holds. (20/150/10,000)
FluidArea-RegenRate= The rate at default value (100) is 0.01 per second per tile, Increase this to regen more, or decrease to regen less. (0/100/1000)
WaterBody-Centroid-Shift-Threshold=Relative centroid movement (as a fraction of the waterbody diameter) required before cached geometry bins are rebuilt. Higher values reduce recalculation frequency. (0.0/0.025/0.5)
Visual-Depletion-Start-Percentage=The percentage at which the visual depletion will start - water tiles will be replaced with dried/land equivalents. (50/80/95)
Pumps-Reactivation-LevelPerThousand=The level (per thousand) at which the waterbody will no longer be depleted after reaching depletion and the pumps will be reactivated. (1/990/1000)
FluidArea-RemoveDepletedOrphaned=Waterbodies will be instantly removed if they are depleted and orphaned. Reactivation Level setting will control how long the waterbody will be considered depleted.
Map-EnableMarkers=Real-time Map Markers that indicate the Name, remaining amount of fluid and the remaining percentage.
FluidArea-MaxFluidAreaSize=Maximum size of the waterbody that will be scanned. Above that no more tiles will be added to the waterbody. 600,000 is an Ocean. Value 0 means no limit. (0/0/9,999,999,999)
FluidArea-Scanning-Loop-Period=Seconds between in-progress scan reminders while a waterbody is still being explored. Lower values will print status messages more frequently. (1/20/600)
Update-Budget-Per-Second=Relative amount of updates per second that the mod will perform. (50/200/10,000)
Splits-EnableFamilies=If enabled, newly split sibling waterbodies are tracked as a family allowing silent renaming to the best successor after scans finish.
Splits-Family-Timeout-Seconds=Maximum time to keep tracking a split family before finalizing automatically. Set to 0 to disable timeout. (0/120/36,000)
Splits-Reeval-Threshold=Minimum relative score improvement required to switch the designated successor during family tracking (0.10 = 10%). (0.0/0.10/1.0)
Split-Max-BBox-Side=Maximum side length of the bounding box used during split-time connected-tile checks to avoid long stalls on huge waterbodies. (8/32/1,024)
WaterBody-Regen-Scaling=Multiplier applied per size tier when calculating natural regeneration. Values above 1.0 boost large bodies, values below 1.0 tone them down. (0.5/1.5/3.0)

